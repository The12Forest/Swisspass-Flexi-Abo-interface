services:
  swisspass-flexiabo:
    image: ghcr.io/the12forest/swisspass-flexi-abo-interface:latest
    container_name: swisspass-flexiabo
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP  → Home Assistant & LAN API
      - "443:443"   # HTTPS → Browser Extension (accept cert once in browser)
    volumes:
      # Persists: token files, profile list, and auto-generated TLS certificate
      - ./data:/app/Backend/saves
    environment:
      - HTTP_PORT=80
      - HTTPS_PORT=443
