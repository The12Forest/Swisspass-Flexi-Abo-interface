<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwissPass FlexiAbo Bridge</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; width: 340px; background: #0f172a; color: #e2e8f0; }
        header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid #1e293b; }
        header img { width: 32px; height: 32px; }
        header h1 { font-size: 15px; font-weight: 600; }
        #global-status { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        section { padding: 12px 16px; border-bottom: 1px solid #1e293b; }
        label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
        .input-row { display: flex; gap: 6px; }
        input[type=text] { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; padding: 7px 10px; font-size: 13px; outline: none; }
        input[type=text]:focus { border-color: #3b82f6; }
        select { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; padding: 7px 10px; font-size: 13px; outline: none; cursor: pointer; }
        button { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        button:hover { background: #2563eb; }
        button:disabled { opacity: .5; cursor: default; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }

        .status-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #1e293b; }
        .badge.ok { background: #166534; color: #bbf7d0; }
        .badge.err { background: #7f1d1d; color: #fecaca; }

        .actions { display: flex; gap: 8px; padding: 12px 16px; }
        .actions button, .actions a { flex: 1; text-align: center; text-decoration: none; font-size: 13px; padding: 8px; border-radius: 7px; }
        .btn-primary { background: #3b82f6; color: #fff; border: none; cursor: pointer; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
        .btn-secondary:hover { color: #e2e8f0; }

        footer { font-size: 11px; color: #475569; text-align: center; padding: 10px 16px; }
        footer a { color: #3b82f6; text-decoration: none; }

        #profile-row { display: flex; gap: 6px; align-items: center; }
        #new-profile-row { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }
        #new-profile-row .input-row { gap: 6px; }
        .token-status { font-size: 11px; color: #64748b; margin-top: 6px; text-align: center; }
        .token-status.found { color: #4ade80; }
    </style>
</head>
<body>
    <header>
        <img src="icons/icon48.png" alt="icon">
        <div>
            <h1>FlexiAbo Bridge</h1>
            <p id="global-status">Prüfe Status...</p>
        </div>
    </header>

    <!-- Server URL -->
    <section>
        <label for="server-url">Server URL</label>
        <div class="input-row">
            <input type="text" id="server-url" placeholder="http://192.168.1.x:3001" spellcheck="false">
            <button id="btn-save">Speichern</button>
        </div>
    </section>

    <!-- Profile -->
    <section>
        <label>Profil</label>
        <div id="profile-row">
            <select id="profile-select">
                <option value="">Lade Profile...</option>
            </select>
            <button id="btn-new-profile">+ Neu</button>
        </div>
        <div id="new-profile-row">
            <div class="input-row">
                <input type="text" id="new-profile-name" placeholder="profilname (z.B. main)">
                <button id="btn-create-profile">Erstellen</button>
                <button id="btn-cancel-profile" class="btn-danger">✕</button>
            </div>
        </div>
        <p id="token-status" class="token-status">—</p>
    </section>

    <!-- Status -->
    <section class="status-section">
        <div class="status-row">
            <span>Server erreichbar</span>
            <span id="st-server" class="badge">--</span>
        </div>
        <div class="status-row">
            <span>Token synchronisiert</span>
            <span id="st-token" class="badge">--</span>
        </div>
    </section>

    <div class="actions">
        <button id="btn-send-token" class="btn-primary">Token senden</button>
        <a id="btn-open" href="#" target="_blank" class="btn-secondary">App öffnen</a>
    </div>

    <footer>
        Besuche <a href="https://www.swisspass.ch" target="_blank">swisspass.ch</a> und melde dich an
    </footer>

    <script src="popup.js"></script>
</body>
</html>
